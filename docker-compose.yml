services:

  # ── DEV (develop branch) ─────────────────────────────
  backend-dev:
    profiles: ["dev"]
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - .env.development

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://localhost:5000/api
        NODE_ENV: development
    ports:
      - "5173:4173"
    env_file:
      - .env.development

  # ── TEST (test branch) ────────────────────────────────
  backend-test:
    profiles: ["test"]
    build: ./backend
    ports:
      - "5001:5001"
    env_file:
      - .env.testing

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://localhost:5001/api
        NODE_ENV: testing
    ports:
      - "5174:4173"
    env_file:
      - .env.testing

  # ── STAGING (stage branch) ────────────────────────────
  backend-staging:
    profiles: ["staging"]
    build: ./backend
    ports:
      - "5002:5002"
    env_file:
      - .env.staging

  frontend-staging:
    profiles: ["staging"]
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://localhost:5002/api
        NODE_ENV: staging
    ports:
      - "5175:4173"
    env_file:
      - .env.staging

  # ── PRODUCTION (main branch) ──────────────────────────
  backend-prod:
    profiles: ["prod"]
    build: ./backend
    ports:
      - "5003:5003"
    env_file:
      - .env.production

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://localhost:5003/api
        NODE_ENV: production
    ports:
      - "5176:4173"
    env_file:
      - .env.production
